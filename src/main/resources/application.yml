        prepay:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://192.168.128.247:14333/prepay?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          username: root
          password: 9c98eCFD84F299F76F6D4252DE111484(*&^%$
          type: com.zaxxer.hikari.HikariDataSource # 新增
          hikari:
