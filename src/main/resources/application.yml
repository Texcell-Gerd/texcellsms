server:
  port: 8899
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 100
      min-spare: 20
    connection-timeout: 600000
    max-connections: 5000
    max-http-form-post-size: 10485760
    accesslog:
      enabled: true
      directory: logs
      pattern: '%t %a "%r" %s %b %D'
      rename-on-rotate: true

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 600000
      idle-timeout: 28800000
      leak-detection-threshold: 0
      max-lifetime: 28800000
      validation-timeout: 300000
      connection-test-query: "SELECT 1"
      test-while-idle: false
      test-on-borrow: false
      pool-name: TexcellSMS-HikariPool

  mvc:
    async:
      request-timeout: 3600000
    static-path-pattern: /static/**
    format:
      date: yyyy/MM/dd
      date-time: yyyy/MM/dd HH:mm:ss

  jackson:
    date-format: yyyy/MM/dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis:
  type-aliases-package: com.texcellsms.sms.model.entity,com.texcellsms.sms.model.DTO
  type-handlers-package: com.texcellsms.sms.config
  configuration:
    map-underscore-to-camel-case: true
    lazy-loading-enabled: false
    aggressive-lazy-loading: false
    auto-mapping-behavior: PARTIAL
    default-statement-timeout: 600
    default-fetch-size: 1000
    local-cache-scope: STATEMENT
    cache-enabled: false
    log-slow-sql: true
    slow-sql-time: 5000
  mapper-locations: classpath:empty.xml

# =================================================================

texcellsms:
  google-auth:
    issuer: TexcellSMS
    period: 30
    digits: 6
  crypto:
    des3-key: "texcellsms_des3_key_1234567890"
    hmac-key: "texcellsms_hmac_key_1234567890"
  encoding:
    default-charset: UTF-8
    gsm7-charset: GSM0338

  query:
    max-query-days: 3
    max-export-days: 3
    max-page-size: 50
    max-export-records: 50000
    default-page-size: 20
    query-timeout: 600

management:
  health:
    redis:
      enabled: false   # 关闭 Redis 检查
    db:
      enabled: false   # 关闭数据库检查
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always