  # 跨域配置（适配前端请求头X-Request/Authorization）
  cors:
    allowed-origins: "*" # 开发环境允许所有来源，生产环境需指定前端域名
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: X-Request,Authorization,Content-Type
    allow-credentials: true
    max-age: 3600

# MyBatis配置
mybatis:
  # Mapper文件路径（需手动创建对应目录）
  mapper-locations: classpath:mapper/**/*.xml
  # 实体类别名包路径
  type-aliases-package: com.texcellsms.model.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 日志实现（开发环境开启，生产环境关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启延迟加载
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

# 日志配置
logging:
  level:
    # Mapper接口日志级别（开发环境debug，生产环境info）
    com.texcellsms.mapper: debug
    # 控制器日志级别
    com.texcellsms.controller: info
    # 动态数据源日志（方便调试数据源切换）
    com.baomidou.dynamic.datasource: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  # 日志文件存储（可选）
  file:
    name: logs/texcell-sms.log
    max-size: 100MB
    max-history: 7

# 自定义配置（业务常量）
texcellsms:
  # Google两步认证配置
  google-auth:
    issuer: TexcellSMS # 二维码显示的发行方名称
    period: 30 # 验证码有效期（秒）
    digits: 6 # 验证码位数
  # 加解密密钥（需替换为实际项目密钥）
  crypto:
    des3-key: "texcellsms_des3_key_1234567890" # DES3密钥（需16/24位）
    hmac-key: "texcellsms_hmac_key_1234567890" # HMACSHA256密钥
  # 编码转换配置
  encoding:
    default-charset: UTF-8
    gsm7-charset: GSM0338