# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 100
      min-spare: 20
    connection-timeout: 300000
    max-connections: 5000

# Spring核心配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 300000      # 5分钟，适配长查询
      idle-timeout: 28800000          # 8小时，避免连接提前回收
      leak-detection-threshold: 0     # 关闭泄漏检测
      max-lifetime: 28800000          # 8小时，匹配数据库默认连接超时
      validation-timeout: 300000      # 5分钟
      connection-test-query: "SELECT 1"
      test-while-idle: false          # 关闭空闲连接检测
      test-on-borrow: false           # 关闭获取连接时检测

  mvc:
    async:
      request-timeout: 1800000        # 30分钟，兜底长查询

# MyBatis核心配置
mybatis:
  type-aliases-package: com.texcellsms.sms.model.entity,com.texcellsms.sms.model.DTO
  type-handlers-package: com.texcellsms.sms.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    lazy-loading-enabled: false
    aggressive-lazy-loading: false
    auto-mapping-behavior: PARTIAL
    default-statement-timeout: 1800    # 30分钟，适配长查询
    default-fetch-size: 1000
    local-cache-scope: STATEMENT
    cache-enabled: false
  mapper-locations: classpath:empty.xml

# 日志配置
logging:
  level:
    com.texcellsms.sms.mapper: info
    com.texcellsms.sms.controller: info
    com.texcellsms.sms.service: warn
    org.springframework.jdbc.datasource: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/texcell-sms.log
    max-size: 100MB
    max-history: 7

# 自定义业务配置
texcellsms:
  google-auth:
    issuer: TexcellSMS
    period: 30
    digits: 6
  crypto:
    des3-key: "texcellsms_des3_key_1234567890"
    hmac-key: "texcellsms_hmac_key_1234567890"
  encoding:
    default-charset: UTF-8
    gsm7-charset: GSM0338

# SpringDoc/OpenAPI配置
springdoc:
  packages-to-scan: com.texcellsms.sms.controller
  models-package: com.texcellsms.sms.model.entity,com.texcellsms.sms.model.dto
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs
  default-flat-param-object: true
  global-headers:
    - name: X-Request
      description: 接口类型标识
      required: true
      schema:
        type: string
    - name: Authorization
      description: 鉴权令牌（登录接口除外）
      required: false
      schema:
        type: string

# 自定义OpenAPI文档信息
openapi:
  info:
    title: TexcellSMS 短信服务接口文档
    description: 包含充值，发送记录查询、多数据源操作等核心接口
    version: 1.0.0
    contact:
      name: 开发团队
      email: dev@texcellsms.com