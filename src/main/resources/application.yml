server:
  port: 8091
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 100
      min-spare: 20
    connection-timeout: 600000
    max-connections: 5000

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 600000
      idle-timeout: 28800000
      leak-detection-threshold: 0
      max-lifetime: 28800000
      validation-timeout: 300000
      connection-test-query: "SELECT 1"
      test-while-idle: false
      test-on-borrow: false

  mvc:
    async:
      request-timeout: 3600000

mybatis:
  type-aliases-package: com.texcellsms.sms.model.entity,com.texcellsms.sms.model.DTO
  type-handlers-package: com.texcellsms.sms.config

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    lazy-loading-enabled: false
    aggressive-lazy-loading: false
    auto-mapping-behavior: PARTIAL
    default-statement-timeout: 600
    default-fetch-size: 1000
    local-cache-scope: STATEMENT
    cache-enabled: false
  mapper-locations: classpath:empty.xml

logging:
  level:
    com.texcellsms.sms: debug
    org.apache.ibatis: debug
    org.springframework: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/texcell-sms.log
    max-size: 100MB
    max-history: 7

texcellsms:
  google-auth:
    issuer: TexcellSMS
    period: 30
    digits: 6
  crypto:
    des3-key: "texcellsms_des3_key_1234567890"
    hmac-key: "texcellsms_hmac_key_1234567890"
  encoding:
    default-charset: UTF-8
    gsm7-charset: GSM0338