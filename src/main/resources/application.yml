# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    # 新增：适配30万条导出，调大Tomcat线程池和连接数
    threads:
      max: 200
      min-spare: 50
    connection-timeout: 300000
    max-connections: 10000

# Spring核心配置
spring:
  # 数据源基础配置（覆盖默认值，适配30万条导出）
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 300000
      idle-timeout: 600000


  # 跨域配置（注释，如需开启可解除）
  #  cors:
  #    allowed-origin-patterns: "*"
  #    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  #    allowed-headers: X-Request,Authorization,Content-Type
  #    allow-credentials: true
  #    max-age: 3600
  # Security配置（自定义账号密码，如需开启可解除）
  #  security:
  #    user:
  #      name: admin
  #      password: 123456
  # 新增：适配30万条导出，调大异步请求超时（30分钟）
  mvc:
    async:
      request-timeout: 1800000

# MyBatis核心配置（注解式，无需XML扫描）
mybatis:
  type-aliases-package: com.texcellsms.sms.model.entity,com.texcellsms.sms.model.DTO
  type-handlers-package: com.texcellsms.sms.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    auto-mapping-behavior: NONE
    # 新增：适配30万条导出，全局调大SQL超时和批量参数
    default-statement-timeout: 300
    default-fetch-size: 1000
  # 核心新增：明确指定空的XML扫描路径，禁用XML解析
  mapper-locations: classpath:empty.xml

# 日志配置
logging:
  level:
    com.texcellsms.sms.mapper: debug  # 打印Mapper调试日志
    com.texcellsms.sms.controller: info
    org.springframework.jdbc.datasource: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/texcell-sms.log
    max-size: 100MB
    max-history: 7

# 自定义业务配置
texcellsms:
  google-auth:
    issuer: TexcellSMS
    period: 30
    digits: 6
  crypto:
    des3-key: "texcellsms_des3_key_1234567890"
    hmac-key: "texcellsms_hmac_key_1234567890"
  encoding:
    default-charset: UTF-8
    gsm7-charset: GSM0338

# SpringDoc/OpenAPI配置
springdoc:
  packages-to-scan: com.texcellsms.sms.controller
  models-package: com.texcellsms.sms.model.entity,com.texcellsms.sms.model.dto  # 包含DTO
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs
  default-flat-param-object: true
  global-headers:
    - name: X-Request
      description: 接口类型标识
      required: true
      schema:
        type: string
    - name: Authorization
      description: 鉴权令牌（登录接口除外）
      required: false
      schema:
        type: string

# 自定义OpenAPI文档信息
openapi:
  info:
    title: TexcellSMS 短信服务接口文档
    description: 包含充值，发送记录查询、多数据源操作等核心接口
    version: 1.0.0
    contact:
      name: 开发团队
      email: dev@texcellsms.com